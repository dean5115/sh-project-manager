services:
  - type: web
    name: sh-pm-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && pnpm install --frozen-lockfile --prod=false && pnpm --filter @sitepilot/api exec prisma generate && PUPPETEER_CACHE_DIR=/opt/render/project/src/apps/api/.puppeteer-cache pnpm --filter @sitepilot/api exec puppeteer browsers install chrome && pnpm --filter @sitepilot/api run build
    startCommand: node dist/apps/api/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/apps/api/.puppeteer-cache
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
